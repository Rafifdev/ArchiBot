<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCHIBOT DASHBOARD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
    <!-- Google Fonts: Poppins (400..700), Google Sans Flex, Google Sans Code & Material/Google Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@8..144,-10..0,25..150,400..700,0..100&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Symbols:opsz,wght,FILL,GRAD,ROND@20..48,100..700,0..1,-50..200,0..100&display=block" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <script>
      (function() {
        var userChoice = localStorage.getItem('archibot_theme_mode_user_choice');
        var mode = (userChoice === 'light' || userChoice === 'dark' || userChoice === 'auto') ? userChoice : 'auto';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      /* FOUT Shield: Prevent Material Symbols from rendering raw ligature text before font loads */
      html:not(.fonts-loaded) .material-symbols-outlined,
      html:not(.fonts-loaded) md-icon {
        visibility: hidden !important;
      }
    </style>
    <script>
      (function() {
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            document.documentElement.classList.add('fonts-loaded');
          }).catch(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
          setTimeout(function() {
            document.documentElement.classList.add('fonts-loaded');
          }, 800);
        } else {
          document.documentElement.classList.add('fonts-loaded');
        }
      })();
    </script>
  </head>
  <body class="bg-discord-canvas text-discord-text font-sans antialiased selection:bg-discord-blurple/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
